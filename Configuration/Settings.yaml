Medienreaktor:
  NeosApi:
    # Content repository this API exposes
    contentRepository: 'default'

    oauth:
      # Issuer identifier used in discovery metadata; falls back to the request base URI when empty
      issuer: ''

      # RSA key pair for signing access tokens (JWT) and the Defuse encryption key
      # for auth codes / refresh tokens. Generate via: ./flow neosapi:generatekeys
      privateKeyPath: '%FLOW_PATH_DATA%Persistent/Medienreaktor.NeosApi/oauth-private.key'
      publicKeyPath: '%FLOW_PATH_DATA%Persistent/Medienreaktor.NeosApi/oauth-public.key'
      encryptionKeyPath: '%FLOW_PATH_DATA%Persistent/Medienreaktor.NeosApi/oauth-encryption.key'

      accessTokenTtl: 'PT1H'
      refreshTokenTtl: 'P30D'
      authCodeTtl: 'PT10M'

      # OAuth 2.1 dynamic client registration (RFC 7591). Public clients only
      # (MCP clients etc.); confidential clients are created via CLI.
      # Disabled by default: the endpoint is unauthenticated and unlimited, so
      # leaving it open in production invites anonymous client creation.
      # Enable it deliberately (the Development context ships it enabled).
      dynamicClientRegistration:
        enabled: false

      # Scopes this authorization server hands out. Requested scopes are
      # intersected with the client's allowed scopes; actual authorization is
      # ALWAYS additionally bound to the Flow account's roles and the CR's
      # own permission checks - scopes can only narrow, never widen access.
      scopes:
        'neos.read': 'Read nodes, workspaces, node types and dimensions'
        'neos.write': 'Execute content repository commands'
        'neos.publish': 'Publish, discard and rebase workspaces'
        'neos.media': 'Browse, upload and manage media assets'

      # For client_credentials tokens (no user): map client identifiers to
      # Flow account identifiers whose roles the token acts with.
      clientCredentialsAccounts: {}

    # Endpoints generated from attribute-annotated Api classes (neos/openapi).
    # Registering a class here is what puts its operations into routing, into
    # the served OpenAPI document and into ./flow routing:list - one entry per
    # migrated feature. Every method of a registered class must also be covered
    # by a Policy.yaml matcher, exactly as a controller action is.
    openApi:
      info:
        title: 'Neos API'
        version: '1.9'
      apiClasses:
        'Dimensions':
          className: 'Medienreaktor\NeosApi\Features\Dimensions\DimensionsApi'
          tag: 'Dimensions'
          tagDescription: 'The configured content dimensions.'
          position: '10'
        'NodeTypes':
          className: 'Medienreaktor\NeosApi\Features\NodeTypes\NodeTypesApi'
          tag: 'NodeTypes'
          tagDescription: 'The node type schema.'
          position: '20'
        'DataSources':
          className: 'Medienreaktor\NeosApi\Features\DataSources\DataSourcesApi'
          tag: 'DataSources'
          tagDescription: 'Invoke Neos data sources (select-box style editor options).'
          position: '30'

    # The authentication provider name whose accounts API users authenticate as
    accountAuthenticationProviderName: 'Neos.Neos:Backend'

    # Packages can contribute additional data to the workspace JSON without
    # this API knowing their shape: each registered enricher (implementing
    # WorkspaceDataEnricherInterface) adds its contribution to the workspace's
    # "extensions" object under the registration key. Set an entry to null to
    # disable it; "position" (PositionalArraySorter) orders evaluation.
    #
    # workspaceDataEnrichers:
    #   'Vendor.Package:Something':
    #     enricher: 'Vendor\Package\Api\SomethingWorkspaceDataEnricher'
    #     position: 'end'
    workspaceDataEnrichers: {}

    # Packages that narrow which nodes this API lists - an access-control
    # package, a per-account visibility rule. Each registered filter
    # (implementing NodeReadFilterInterface) is asked to reduce every node
    # listing before it is serialized; the API never learns what the narrowing
    # means, only that somebody narrows.
    #
    # Filters may only ever REMOVE nodes, and the content repository's own
    # constraints (subtree tags, workspace permissions) have been applied long
    # before they run. Single-node reads are deliberately not filtered - see
    # the interface for why.
    #
    # nodeReadFilters:
    #   'Vendor.Package:something':
    #     filter: 'Vendor\Package\Service\SomethingNodeReadFilter'
    nodeReadFilters: {}

    # Capability flags reported by /api/me: name => Flow privilege target that
    # must be granted to the account's roles. Uses the same checks the classic
    # backend menu uses to show/hide modules, so clients can mirror the module
    # visibility of the old UI. Extend or override per distribution.
    accountPermissions:
      media: 'Neos.Media.Browser:ManageAssets'
      users: 'Neos.Neos:Backend.Module.Administration.Users'
      sites: 'Neos.Neos:Backend.Module.Administration.Sites'
      # The classic module lives in Neos.Workspace.Ui since Neos 9 - note the
      # singular "Workspace" in the target name.
      workspaces: 'Neos.Workspace.Ui:Backend.Module.Management.Workspace'
      administration: 'Neos.Neos:Backend.Module.Administration'

Neos:
  Flow:
    mvc:
      routes:
        # Operations generated from the Api classes, one route each. A
        # providerFactory can only be declared here, not in a package's own
        # Routes.yaml, which Flow parses as plain route definitions. Declared
        # before the static routes so a migrated path wins over any leftover
        # route for the same URI.
        'Medienreaktor.NeosApi:OpenApi':
          providerFactory: 'Medienreaktor\NeosApi\Framework\OpenApiRoutesProviderFactory'
          position: 'before Medienreaktor.NeosApi'
        'Medienreaktor.NeosApi':
          position: 'before Neos.Neos'

    security:
      authentication:
        providers:
          # Bearer-token authentication for all /api requests. Hydrates a full
          # Flow account (-> roles -> policies) from a validated OAuth token,
          # so token requests are policy-enforced identically to sessions.
          'Medienreaktor.NeosApi:Bearer':
            label: 'Neos API OAuth 2.1 Bearer'
            provider: 'Medienreaktor\NeosApi\Security\Authentication\Provider\OAuthBearerProvider'
            token: 'Medienreaktor\NeosApi\Security\Authentication\Token\ApiBearerToken'
            requestPatterns:
              # Path-based rather than controller-based: migrated endpoints are
              # served by one generic dispatch controller (see
              # Framework\OpenApiRoutesProvider), so a controller name no longer
              # identifies "an API request". The path always has.
              'Medienreaktor.NeosApi:ApiUri':
                pattern: 'Uri'
                patternOptions:
                  uriPattern: '/api/.*'

          # Make the Neos backend session visible on the OAuth authorize
          # endpoint (patterns of the same type are OR-combined), so the
          # consent screen can identify the logged-in editor.
          'Neos.Neos:Backend':
            requestPatterns:
              'Medienreaktor.NeosApi:OAuthAuthorize':
                pattern: 'ControllerObjectName'
                patternOptions:
                  controllerObjectNamePattern: 'Medienreaktor\NeosApi\Controller\OAuth\AuthorizeController'
